<style>
/* 레이아웃: 서버실 디오라마(전체 화면 3D) 위에 왼쪽 작업 카드 · 오른쪽 계측 패널 · 아래 조작 막대 */
:root{

}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--room);color:var(--ink);font:14px/1.55 var(--sans)}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv.hot{cursor:pointer}
.brand{position:fixed;left:max(24px,env(safe-area-inset-left,0px));top:calc(20px + env(safe-area-inset-top,0px));z-index:3;color:#efe7da;font:500 15px var(--mono);display:flex;gap:10px;align-items:baseline}

.clock span{padding:6px 14px;border-radius:999px}.clock b{color:var(--ink);font-weight:600;margin-left:6px}.clock .on{background:var(--panel);color:#cfc6b6}.clock .on b{color:#f27a3d}
.lesson{position:fixed;left:max(20px,env(safe-area-inset-left,0px));top:calc(92px + env(safe-area-inset-top,0px));bottom:20px;width:360px;z-index:3;display:flex;flex-direction:column;gap:12px;padding:30px 18px 16px;border-radius:4px 14px 12px 12px;
  background:#d9b878 repeating-linear-gradient(93deg,rgba(120,85,30,.05) 0 2px,transparent 2px 7px);box-shadow:inset 0 0 0 1px rgba(110,78,30,.25),0 18px 50px rgba(0,0,0,.45);color:var(--ink)}

.lesson.closed>*:not(.fspine){opacity:0;visibility:hidden;pointer-events:none}
.fold{position:absolute;right:10px;top:-28px;z-index:3;border:0;background:#d9b878;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 1px 0 0 rgba(110,78,30,.25),inset -1px 0 0 rgba(110,78,30,.25);border-radius:9px 9px 0 0;padding:6px 12px 7px;font:600 12px var(--sans);color:#5c4a28;cursor:pointer}

.lesson.closed .fspine{display:flex}

.fspine:focus-visible,.fold:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lesson::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;border-radius:0 0 12px 12px;background:rgba(110,78,30,.12)}
.ftab{position:absolute;left:0;top:-30px;height:31px;padding:6px 14px 0;border-radius:10px 10px 0 0;background:#d9b878;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 1px 0 0 rgba(110,78,30,.25),inset -1px 0 0 rgba(110,78,30,.25)}

#pop .acts button:first-child{background:#2a2620;color:#fff7d6}

.doc{position:relative;width:min(700px,100%);max-height:88vh;overflow:auto;background:#fbfaf5;color:#2a2620;padding:44px 48px 36px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:docin .28s cubic-bezier(.2,.8,.3,1)}

.doc::before{content:"";position:absolute;left:50%;top:16px;width:90px;height:10px;margin-left:-45px;background:radial-gradient(circle at 6px 5px,#d6cebd 5px,transparent 5.5px),radial-gradient(circle at 84px 5px,#d6cebd 5px,transparent 5.5px)}

.doc th{background:#f1ece0;font-weight:500;width:30%;color:#4a453b}

.doc ul.ck{list-style:none;margin:0;padding:0}.doc ul.ck li{padding:5px 0;border-bottom:1px dashed #d8cfbd;font-size:14px}.doc ul.ck li::before{content:"☐ ";font-family:var(--mono)}.doc ul.ck li.y::before{content:"☑ ";color:#1f7a50}
.doc .sign{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}

.doc .sign div b{display:block;height:58px;display:grid;place-items:center;border-top:1px solid #cfc6b2}
.lbig{display:flex;align-items:stretch;margin:6px 0 4px;max-width:560px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18))}
.lbig .lp{position:relative;flex:0 0 62%;background:#fff;padding:18px 20px;border-radius:4px 0 0 4px;display:flex;flex-direction:column;gap:2px;font-family:var(--mono)}
.lbig .lp b{font-size:42px;letter-spacing:.04em;line-height:1}
.lbig .lp span{font-size:15px}.lbig .lp .lt{color:#7a7364;font-size:13px}
.lbig .lp i{position:absolute;right:18px;top:20px;width:110px;height:30px;background:repeating-linear-gradient(90deg,#111 0 2px,transparent 2px 4px,#111 4px 5px,transparent 5px 8px)}
.lbig .lp em{position:absolute;right:18px;bottom:12px;font-style:normal;font-size:13px;color:#7a7364}
.lbig .ll{flex:1;border-radius:0 4px 4px 0;background:repeating-linear-gradient(135deg,rgba(200,215,222,.45) 0 6px,rgba(230,238,242,.35) 6px 12px);border:1px dashed #b9c6cc;border-left:0;display:grid;place-items:center;text-align:center;font:500 11.5px var(--mono);color:#6c7a80;padding:8px}
.stamp{display:inline-block;padding:4px 8px;border:2.5px solid #c0352a;color:#c0352a;border-radius:50%;font:700 13px var(--sans);transform:rotate(-12deg);opacity:.85}
.stamp.no{border-radius:4px;color:#555;border-color:#777}
.doc .pen{margin-top:20px;padding:10px 0 0;border-top:1px dashed #cfc6b2;font-size:13.5px;color:#4a453b}
.doc .pen b{font:600 11px var(--mono);letter-spacing:.12em;color:#7a7364;display:block;margin-bottom:4px}
.rackmap{display:grid;grid-template-columns:28px 1fr;font:500 10.5px var(--mono);border:1.5px solid #2a2620;max-width:260px}
.rackmap span{border-bottom:1px solid #e3dccb;padding:0 4px;height:15px;line-height:15px;color:#7a7364}
.rackmap i{border-bottom:1px solid #e3dccb;height:15px;line-height:15px;font-style:normal;padding-left:6px;background:#f1ece0}
.rackmap i.e{background:#fff}.rackmap i.t{background:#f9c79b;font-weight:600;color:#2a2620}
@media (prefers-reduced-motion:reduce){.doc{animation:none}}
.instr{position:fixed;right:max(20px,env(safe-area-inset-right,0px));top:calc(72px + env(safe-area-inset-top,0px));width:310px;z-index:3;background:rgba(27,26,24,.94);color:var(--pink);border-radius:18px;padding:16px 18px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.instr{transition:width .25s}
.instr.closed{width:auto;padding:8px}
.instr.closed>*:not(.ifold){display:none}
.ifold{position:absolute;right:12px;top:10px;border:0;background:#2e2b27;color:#cfc6b6;border-radius:6px;padding:4px 10px;font:600 12px var(--sans);cursor:pointer}
.instr.closed .ifold{position:static;padding:8px 14px}
.ifold:hover{background:#3a3631}.ifold:focus-visible{outline:2px solid var(--accent)}
.instr h2{margin:0 0 10px;font:500 11.5px var(--mono);letter-spacing:.14em;color:#9a9284}
.row{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font:400 12.5px var(--mono)}

button:focus-visible,li:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

<body>

<canvas id="cv" aria-label="서버실 3D 디오라마"></canvas>
<div class="brand"><b>idc<em>labs</em></b><i>/</i><span>서버 증설</span></div>
<div class="clock"><span>WO<b>24113</b></span><span class="on">시각<b id="clk">22:06</b></span><span>위치<b>R07 · U10–11</b></span></div>

  <button class="btn" id="prev">이전</button>
  <button class="wif" id="wif" aria-pressed="false"><span class="tg"></span><span><small>만약에</small><br><span id="wifT"></span></span></button>
  <button class="btn pri" id="done">이 단계 완료</button>
</div>
<div class="hint">바닥 클릭 = 그쪽으로 이동 · 드래그 = 돌려 보기 · 오른쪽 드래그 = 옆으로 이동 · 휠 = 확대</div>

<script src="vendor/three-r128.min.js"></script>
<script>
(function(){
const T=THREE, $=id=>document.getElementById(id);
const cv=$('cv');
const R=new T.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio||1,2)); R.outputEncoding=T.sRGBEncoding;
R.shadowMap.enabled=true; R.shadowMap.type=T.PCFSoftShadowMap;
R.toneMapping=T.ACESFilmicToneMapping; R.toneMappingExposure=1.05;
const scene=new T.Scene();
const cam=new T.PerspectiveCamera(32,1,0.1,100);

/* 배경: 따뜻한 어둠 */
