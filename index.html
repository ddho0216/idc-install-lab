<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDC 장비 설치 실습</title>
<meta name="description" content="새 스위치가 IDC에 들어와 관제에 잡힐 때까지, 입고부터 연동까지 3D로 연습하는 가상 실습 (모든 장비·값은 가상)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><b>IDC 장비 설치 실습</b><span>가상 장비 · 실제 장비·고객사와 무관</span></div>
  <div class="meter"><span id="timer">00:00</span><span id="miss">실수 0</span><button id="restart" type="button">처음부터</button></div>
</header>
<main class="lab">
  <nav class="steps" id="steps" aria-label="진행 단계"></nav>
  <section class="stage">
    <canvas id="cv" aria-label="3D 랙 화면"></canvas>
    <div class="views" role="group" aria-label="보기 전환">
      <button data-view="front" type="button">전면</button>
      <button data-view="rear" type="button">후면</button>
      <button data-view="top" type="button">위쪽 확대</button>
    </div>
    <p class="hint3d">드래그 = 회전 · 휠 = 확대 · 우클릭 드래그 = 이동</p>
  </section>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</main>
<script src="vendor/three.min.js"></script>
<script src="js/cli.js"></script>
<script src="js/scene.js"></script>
<script src="js/app.js"></script>
</body>
</html>
